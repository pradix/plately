<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" version="1.2" baseProfile="tiny-ps"
     role="img" aria-labelledby="bimi-title">
  <title id="bimi-title">Plately</title>

  <!-- Groene achtergrond -->
  <rect width="200" height="200" fill="#4d7052"/>

  <!-- P-frame als dikke stroke (linker lat + bovenkant + D-curve) -->
  <path d="M 62 160 L 62 30 Q 62 18 75 18 L 118 18 Q 170 18 170 97 Q 170 174 118 174 L 75 174 Q 62 174 62 160"
        fill="none" stroke="white" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Kom onderaan (gevuld, sluit aan op de P-frame onderkant) -->
  <path d="M 54 172 Q 56 196 101 198 Q 146 196 148 172 Z"
        fill="white"/>

  <!-- Blad links (buiten de P, bewust links van de lat) -->
  <path d="M 53 152 Q 14 130 16 90 Q 18 52 50 60 Q 44 82 45 106 Q 44 130 53 152 Z"
        fill="white"/>
  <path d="M 32 120 Q 24 107 33 93"
        fill="none" stroke="#4d7052" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Garde (links, in de P) -->
  <g transform="translate(88, 80)">
    <circle cx="0" cy="-8" r="3" fill="none" stroke="white" stroke-width="2.5"/>
    <line x1="0" y1="-5" x2="0" y2="22" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <path d="M -9 8 Q -12 19 -9 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -4 6 Q -6 19 -4 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M  4 6 Q  6 19  4 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M  9 8 Q 12 19  9 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Lepel (rechts, in de P) -->
  <g transform="translate(118, 72)">
    <circle cx="0" cy="-3" r="3" fill="none" stroke="white" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="0" y2="30" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="0" cy="41" rx="9" ry="12" fill="white"/>
  </g>

  <!-- Hart -->
  <g transform="translate(101, 123)">
    <path d="M 0 9 C -7 3 -13 3 -13 -4 C -13 -10 -6 -13 0 -7 C 6 -13 13 -10 13 -4 C 13 3 7 3 0 9"
          fill="#e8542a"/>
  </g>
</svg>
