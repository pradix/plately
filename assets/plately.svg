<svg viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Define the leaf -->
  <g id="leaf">
    <path d="M 50 140 Q 35 160 40 185 Q 45 165 55 180 Q 60 160 50 140" fill="#8fb3a0"/>
    <path d="M 45 160 Q 42 170 45 180" stroke="#6b8f7f" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Bowl/Container outline (D-shaped) -->
  <path d="M 65 60 Q 55 60 55 75 L 55 140 Q 55 155 65 160 L 140 160 Q 150 155 150 140 L 150 75 Q 150 60 140 60 Z"
        fill="none" stroke="#8fb3a0" stroke-width="12" stroke-linejoin="round"/>

  <!-- Whisk -->
  <g id="whisk">
    <!-- Handle -->
    <line x1="80" y1="60" x2="80" y2="120" stroke="#8fb3a0" stroke-width="5" stroke-linecap="round"/>
    <!-- Whisk loops -->
    <ellipse cx="80" cy="95" rx="6" ry="14" fill="none" stroke="#8fb3a0" stroke-width="3"/>
    <ellipse cx="72" cy="100" rx="5" ry="12" fill="none" stroke="#8fb3a0" stroke-width="2.5"/>
    <ellipse cx="88" cy="100" rx="5" ry="12" fill="none" stroke="#8fb3a0" stroke-width="2.5"/>
  </g>

  <!-- Spoon -->
  <g id="spoon">
    <!-- Handle -->
    <line x1="120" y1="60" x2="120" y2="120" stroke="#8fb3a0" stroke-width="5" stroke-linecap="round"/>
    <!-- Spoon bowl -->
    <ellipse cx="120" cy="95" rx="12" ry="18" fill="#8fb3a0" opacity="0.8"/>
  </g>

  <!-- Heart -->
  <g id="heart">
    <path d="M 100 125 C 95 120 85 120 85 128 C 85 135 100 145 100 145 C 100 145 115 135 115 128 C 115 120 105 120 100 125 Z"
          fill="#ff9966"/>
  </g>
</svg>