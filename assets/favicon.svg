<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#fbf7f1"/>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#8da485" stroke-width="10"/>

  <!-- Leaf left side -->
  <path d="M 45 120 Q 32 110 36 85 Q 40 72 52 77 Q 48 85 50 100 Q 48 113 45 120" fill="#8da485" stroke="#6b9b7b" stroke-width="1.5"/>
  <path d="M 48 100 Q 42 94 50 84" fill="none" stroke="#6b9b7b" stroke-width="1.5" opacity="0.6"/>

  <!-- Hand/bowl container -->
  <path d="M 65 60 L 78 60 Q 87 60 87 68 L 87 128 Q 87 136 78 136 L 65 136 Q 57 136 57 128 L 57 68 Q 57 60 65 60"
        fill="none" stroke="#8da485" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bowl bottom -->
  <ellipse cx="85" cy="136" rx="28" ry="14" fill="#8da485"/>

  <!-- Whisk (left utensil) -->
  <g transform="translate(75, 82)">
    <line x1="0" y1="0" x2="0" y2="22" stroke="#8da485" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="0" cy="2" r="1.3" fill="#8da485"/>
    <circle cx="0" cy="20" r="1.3" fill="#8da485"/>
    <!-- Whisk wires -->
    <path d="M -5 9 Q -7 14 -5 19" fill="none" stroke="#8da485" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M -3 7 Q -4 14 -3 20" fill="none" stroke="#8da485" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 0 7 Q 0 14 0 20" fill="none" stroke="#8da485" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 3 7 Q 4 14 3 20" fill="none" stroke="#8da485" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 5 9 Q 7 14 5 19" fill="none" stroke="#8da485" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Spoon (right utensil) -->
  <g transform="translate(95, 78)">
    <line x1="0" y1="0" x2="0" y2="27" stroke="#8da485" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="0" cy="2" r="1.3" fill="#8da485"/>
    <!-- Spoon bowl -->
    <ellipse cx="0" cy="35" rx="7.5" ry="9" fill="#8da485"/>
  </g>

  <!-- Heart -->
  <g transform="translate(85, 104)">
    <path d="M 0 4.5 C -3.5 2 -7 2 -7 -1.5 C -7 -4 -4.5 -6.5 0 -3 C 4.5 -6.5 7 -4 7 -1.5 C 7 2 3.5 2 0 4.5"
          fill="#f6b69d" stroke="#f6b69d" stroke-width="0.5"/>
  </g>
</svg>