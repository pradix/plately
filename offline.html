<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline – Plately</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fbf7f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #25211d;
      padding: 32px 24px;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      margin-bottom: 28px;
      background: #dce8dc;
      display: grid;
      place-items: center;
    }
    .icon svg {
      width: 32px;
      height: 32px;
      color: #5a7a5e;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.97rem;
      color: #726b63;
      line-height: 1.6;
      max-width: 320px;
      margin-bottom: 32px;
    }
    button {
      background: #8da485;
      color: #fff;
      border: none;
      border-radius: 18px;
      padding: 12px 28px;
      font-size: 0.97rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 140ms;
    }
    button:hover { background: #7a9172; }
  </style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
    </svg>
  </div>
  <h1>Geen verbinding</h1>
  <p>Je bent offline en deze pagina staat niet in de cache. Controleer je internetverbinding en probeer het opnieuw.</p>
  <button onclick="window.location.reload()">Opnieuw proberen</button>
</body>
</html>
